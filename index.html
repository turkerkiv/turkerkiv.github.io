<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Türker Kıvılcım — Software Developer">
<title>Türker Kıvılcım / Blueprint</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
:root{
  --bg:#e8eef3;
  --paper:rgba(248,251,253,.82);
  --ink:#182430;
  --muted:#647482;
  --grid:#c4d2df;
  --line:#9db0c1;
  --blue:#285bc4;
  --blue2:#4d79c7;
  --red:#c85252;
  --max:1120px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  color:var(--ink);
  font-family:Arial,Helvetica,sans-serif;
  line-height:1.5;
  background-color:var(--bg);
  background-image:
    radial-gradient(circle at 1.1px 1.1px,rgba(102,127,151,.52) 1.1px,transparent 1.25px);
  background-size:20px 20px;
}
body.modal-open{overflow:hidden}
a{color:inherit}
.site{width:min(var(--max),calc(100% - 36px));margin:auto;position:relative;z-index:2}

/* blueprint page chrome */
.top{
  height:68px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:2px solid var(--ink);
  font:700 11px "Courier New",monospace;
  letter-spacing:.06em;
}
.top a{text-decoration:none;margin-left:20px}
.top a:hover{color:var(--blue)}
.coord{color:var(--muted);font-weight:400}

.hero{
  position:relative;
  min-height:calc(100vh - 68px);
  padding:74px 0 105px;
  display:grid;
  grid-template-columns:1fr 235px;
  gap:45px;
  align-items:center;
}
.hero:before{
  content:"";
  position:absolute;
  top:0;
  left:0;
  width:150px;
  border-top:1px solid var(--blue);
}
.hero-copy{position:relative}
.stamp{
  display:inline-block;
  border:2px solid var(--blue);
  color:var(--blue);
  padding:7px 10px;
  font:700 10px "Courier New",monospace;
  letter-spacing:.12em;
  transform:rotate(-2deg);
  background:rgba(232,238,243,.56);
}
.hero h1{
  font:700 clamp(4.8rem,12vw,10.4rem)/.73 Georgia,"Times New Roman",serif;
  letter-spacing:-.09em;
  margin:24px 0 28px;
}
.headline{
  max-width:660px;
  margin:0;
  font:500 clamp(1.2rem,2.3vw,1.65rem)/1.2 Georgia,"Times New Roman",serif;
  letter-spacing:-.025em;
}
.hero-side{
  border-left:1px solid var(--line);
  padding-left:25px;
  font-size:12px;
}
.side-item{padding:0 0 24px;margin-bottom:24px;border-bottom:1px dashed #a9bac9}
.side-item:last-child{border-bottom:0}
.side-label{
  color:var(--blue);font:700 10px "Courier New",monospace;
  text-transform:uppercase;letter-spacing:.08em
}
.side-value{margin-top:7px;color:var(--muted);line-height:1.55}
.focus-list{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.focus-list span{
  background:rgba(234,241,249,.82);
  border:1px solid #abc0d5;
  color:#315991;
  padding:4px 7px;
  font:700 10px "Courier New",monospace
}
.hand-note{
  display:inline-block;
  margin-top:25px;
  color:#315b9f;
  font:italic 22px "Segoe Print","Bradley Hand","Comic Sans MS",cursive;
  transform:rotate(-3deg);
  position:relative;
}
.hand-note:before{
  content:"";
  position:absolute;
  left:-11px;right:-11px;top:-7px;height:21px;
  border-top:1px solid rgba(49,91,159,.48);
  border-radius:55%;
  transform:rotate(-2deg)
}
.hand-note:after{
  content:"";
  position:absolute;
  left:9px;right:-13px;bottom:-8px;height:9px;
  border-bottom:2px solid rgba(49,91,159,.68);
  border-radius:50%;
  transform:rotate(-2deg)
}

.section{
  margin:50px 0 75px;
  border-top:2px solid var(--ink);
}
.section-head{
  display:flex;
  justify-content:space-between;
  padding:10px 0;
  font:700 11px "Courier New",monospace;
  color:var(--ink);
}
.section-head span:last-child{color:var(--muted);font-weight:400}

.projects{
  display:grid;
  grid-template-columns:1.2fr .8fr;
  gap:12px;
}
.project{
  min-height:315px;
  border:2px solid var(--ink);
  background:rgba(235,241,246,.78);
  padding:17px;
  display:flex;
  flex-direction:column;
  cursor:pointer;
  position:relative;
  transition:transform .16s ease,background .16s ease;
}
.project:nth-child(2n){transform:translateY(32px)}
.project:hover{background:rgba(252,254,255,.94);transform:translateY(-2px)}
.project:nth-child(2n):hover{transform:translateY(30px)}
.project:before,.project:after{
  content:"";position:absolute;width:14px;height:14px;
  border-color:var(--blue);opacity:.65
}
.project:before{top:-2px;left:-2px;border-top:2px solid;border-left:2px solid}
.project:after{bottom:-2px;right:-2px;border-bottom:2px solid;border-right:2px solid}
.project-no{color:var(--blue);font:700 10px "Courier New",monospace}
.project-category{color:var(--muted);font:10px "Courier New",monospace;margin-top:3px}
.project h2{
  font:600 34px/.88 Georgia,"Times New Roman",serif;
  letter-spacing:-.06em;
  margin:auto 0 12px;
  max-width:530px
}
.project p{color:var(--muted);font-size:12px;max-width:540px;margin:0 0 10px}
.tags span{
  display:inline-block;
  margin:3px 3px 0 0;
  padding:4px 7px;
  border:1px solid #9fb2c4;
  background:rgba(248,251,253,.6);
  color:#4d6379;
  font:10px "Courier New",monospace
}
.project-arrow{position:absolute;right:16px;top:15px;color:var(--blue);font:700 17px "Courier New",monospace}

.about-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}
.note{
  border:1px solid var(--line);
  background:rgba(248,251,253,.62);
  padding:21px;
  min-height:205px;
}
.note h3{
  margin:0 0 10px;color:var(--blue);
  font:700 10px "Courier New",monospace;text-transform:uppercase;
  letter-spacing:.1em
}
.note p{color:var(--muted);font-size:13px;margin:0 0 9px}
.stack{margin-top:12px}
.stack span{
  display:inline-block;border:1px solid #a9bac9;
  padding:5px 7px;margin:3px 3px 0 0;
  color:#52687d;background:rgba(244,249,253,.64);
  font:10px "Courier New",monospace
}
.contact{
  margin:65px 0 0;
  border-top:2px solid var(--ink);
  padding:17px 0 55px;
}
.contact .label{font:700 10px "Courier New",monospace;color:var(--blue)}
.contact a{
  display:inline-block;margin-top:7px;color:var(--ink);
  font:600 16px Georgia,serif;text-decoration:none
}
.contact a:hover{color:var(--blue)}
footer{
  border-top:1px solid var(--line);
  display:flex;justify-content:space-between;
  padding:20px 0 35px;
  color:#68798a;font:10px "Courier New",monospace
}

#inkCanvas{
  position:fixed;inset:0;width:100%;height:100%;
  pointer-events:auto;z-index:25;
  touch-action:none;
}
body{
  user-select:none;
  -webkit-user-select:none;
  cursor:none !important;
}
body *{
  user-select:none;
  -webkit-user-select:none;
  cursor:none !important;
}

/* Custom Animated Drafting Pencil */
.pencil-cursor{
  position:fixed;
  top:-100px;left:-100px;
  width:32px;height:32px;
  pointer-events:none;
  z-index:100;
  display:block;
  transform-origin:2px 30px;
  transform:translate(-2px,-30px) rotate(0deg);
  transition:transform .08s ease-out,opacity .15s ease;
  will-change:transform,left,top;
}
.pencil-cursor.drawing{
  transform:translate(-2px,-30px) rotate(-16deg) scale(.92);
}

/* Nav Clear Button */
.nav-clear-btn{
  color:var(--red) !important;
  border:1px dashed rgba(200,82,82,.6);
  padding:2px 7px;
  font-size:10px;
  letter-spacing:.06em;
  transition:all .15s ease;
  text-decoration:none;
}
.nav-clear-btn:hover{
  background:rgba(200,82,82,.12);
  border-color:var(--red);
}
.nav-export-btn{
  color:var(--blue) !important;
  border:1px solid var(--blue);
  padding:2px 7px;
  font-size:10px;
  letter-spacing:.06em;
  transition:all .15s ease;
  text-decoration:none;
  background:rgba(40,91,196,.06);
}
.nav-export-btn:hover{
  background:var(--blue);
  color:#fff !important;
}

@media print{
  body{cursor:auto !important;background:#fff}
  body *{cursor:auto !important}
  .nav-right,#pencilCursor{display:none !important}
}

.modal{
  position:fixed;inset:0;z-index:30;
  background:rgba(41,61,83,.22);
  display:none;align-items:center;justify-content:center;padding:18px
}
.modal.open{display:flex}
.modal-box{
  width:min(720px,100%);
  max-height:88vh;overflow:auto;
  background:#f4f9fd;
  border:2px solid var(--ink);
  box-shadow:11px 13px 0 rgba(40,91,196,.13);
  padding:27px;
  position:relative
}
.close{
  position:absolute;right:11px;top:11px;
  width:31px;height:31px;border:1px solid #8fa4b8;
  background:#edf4f9;color:#536679;cursor:pointer
}
.modal-cat{color:var(--blue);font:700 10px "Courier New",monospace;text-transform:uppercase}
.modal-box h2{
  font:600 44px/.87 Georgia,"Times New Roman",serif;
  letter-spacing:-.06em;
  max-width:620px;
  margin:11px 45px 15px 0
}
.modal-box p{font-size:13px;color:var(--muted);max-width:650px}
.modal-links{margin-top:20px;font:700 10px "Courier New",monospace}
.modal-links a{color:var(--blue);text-decoration:none;margin-right:18px}

@media(max-width:780px){
  .hero{grid-template-columns:1fr;padding-top:60px}
  .hero-side{border-left:0;border-top:1px solid var(--line);padding:20px 0 0}
  .projects{grid-template-columns:1fr}
  .project:nth-child(2n){transform:none}
  .project:nth-child(2n):hover{transform:translateY(-2px)}
  .about-grid{grid-template-columns:1fr}
}
@media(max-width:560px){
  .site{width:min(100% - 24px,var(--max))}
  .nav-right a:nth-child(2){display:none}
  .hero h1{font-size:5.3rem}
  .project h2{font-size:29px}
  footer{flex-direction:column;gap:7px}
}
</style>
</head>
<body>
<canvas id="inkCanvas"></canvas>
<div class="site">
  <div class="top">
    <span>TK-2026 / SOFTWARE</span>
    <span class="coord">39°00'N · 35°00'E</span>
    <div class="nav-right">
      <a href="#projects" data-label="projects"></a>
      <a href="#about" data-label="about"></a>
      <a id="clearSketch" class="nav-clear-btn" href="javascript:void(0)" title="Tüm çizimleri temizle">TEMİZLE ⌫</a>
      <a id="exportBtn" class="nav-export-btn" href="javascript:void(0)" title="Sayfa ve Çizimlerin Görüntüsünü İndir">ÇIKTI AL ⤓</a>
      <a id="github" href="#" target="_blank">GITHUB ↗</a>
    </div>
  </div>

  <header class="hero">
    <div class="hero-copy">
      <div class="stamp">SYSTEM / AI / BACKEND</div>
      <h1 id="name"></h1>
      <p id="headline" class="headline"></p>
      <div id="handNote" class="hand-note"></div>
    </div>

    <aside class="hero-side">
      <div class="side-item">
        <div class="side-label">Şu anda</div>
        <div class="side-value" id="now"></div>
      </div>
      <div class="side-item">
        <div class="side-label" id="focusLabel"></div>
        <div id="focusList" class="focus-list"></div>
      </div>
      <div class="side-item">
        <div class="side-label">Links</div>
        <div class="side-value">
          <a id="linkedin" href="#" target="_blank">LinkedIn ↗</a><br>
          <a id="cv" href="#" target="_blank">CV ↗</a>
        </div>
      </div>
    </aside>
  </header>

  <section id="projects" class="section">
    <div class="section-head">
      <span data-label="projects"></span>
      <span id="count"></span>
    </div>
    <div id="list" class="projects"></div>
  </section>

  <section id="about" class="section">
    <div class="section-head">
      <span data-label="about"></span>
      <span>02</span>
    </div>
    <div class="about-grid">
      <div class="note">
        <h3 id="aboutTitle"></h3>
        <div id="aboutText"></div>
      </div>
      <div class="note">
        <h3 id="stackTitle">Teknolojiler</h3>
        <div id="stack" class="stack"></div>
      </div>
    </div>
  </section>

  <section class="contact">
    <div class="label" data-label="contact"></div>
    <a id="email" href="#"></a>
  </section>

  <footer>
    <span>© <span id="year"></span> Türker Kıvılcım</span>
    <span id="location"></span>
  </footer>
</div>

<div id="modal" class="modal" aria-hidden="true">
  <div class="modal-box">
    <button class="close" id="close">×</button>
    <div id="modalCat" class="modal-cat"></div>
    <h2 id="modalTitle"></h2>
    <p id="modalDesc"></p>
    <div id="modalStack" class="stack"></div>
    <div id="modalLinks" class="modal-links"></div>
  </div>
</div>

<!-- Custom Animated Drafting Pencil Cursor -->
<div id="pencilCursor" class="pencil-cursor" aria-hidden="true">
  <svg viewBox="0 0 32 32" width="32" height="32" style="filter: drop-shadow(1px 2px 2px rgba(0,0,0,0.35));" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Lead tip -->
    <polygon id="pencilLead" points="2,30 3.5,26.5 5.5,28.5" fill="#285bc4" />
    <!-- Sharpened wood cone -->
    <polygon points="3.5,26.5 5.5,28.5 9,25 7,23" fill="#e8c79c" stroke="#182430" stroke-width="0.6" />
    <!-- Shaft facet 1 (colored) -->
    <polygon id="pencilShaft1" points="7,23 9,25 21,13 19,11" fill="#285bc4" stroke="#182430" stroke-width="0.6" />
    <!-- Shaft facet 2 (highlight) -->
    <polygon points="9,25 11,27 23,15 21,13" fill="#4d79c7" stroke="#182430" stroke-width="0.6" />
    <!-- Metal Ferrule -->
    <polygon points="19,11 23,15 25,13 21,9" fill="#a5b8ca" stroke="#182430" stroke-width="0.6" />
    <!-- Eraser -->
    <polygon points="21,9 25,13 27,11 23,7" fill="#c85252" stroke="#182430" stroke-width="0.6" />
  </svg>
</div>

<script>
let site=null, projects=[];
const $=id=>document.getElementById(id);

async function load(){
  const [a,b]=await Promise.all([
    fetch("./data/site.json"),
    fetch("./data/projects.json")
  ]);
  if(!a.ok || !b.ok) throw new Error("JSON yüklenemedi.");
  site=await a.json();
  projects=await b.json();
  render();
}

function render(){
  const p=site.person;
  $("name").textContent=p.name;
  $("headline").textContent=p.intro;
  $("handNote").textContent=p.hand_note;
  $("github").href=p.github;
  $("linkedin").href=p.linkedin;
  $("cv").href=p.cv;
  $("email").href="mailto:"+p.email;
  $("email").textContent=p.email;
  $("location").textContent=p.location;
  $("now").textContent="Erciyes Üniversitesi Bilgi İşlem Daire Başkanlığı · Full-stack AI Engineer";

  document.querySelectorAll("[data-label]").forEach(el=>{
    el.textContent=site.labels[el.dataset.label];
  });

  $("focusLabel").textContent=site.focus.title;
  $("focusList").innerHTML=site.focus.items.map(x=>`<span>${x}</span>`).join("");
  $("aboutTitle").textContent=site.about.title;
  $("aboutText").innerHTML=site.about.paragraphs.map(x=>`<p>${x}</p>`).join("");
  $("stack").innerHTML=site.stack.map(x=>`<span>${x}</span>`).join("");

  $("count").textContent=String(projects.length).padStart(2,"0");
  $("list").innerHTML=projects.map((p,i)=>`
    <article class="project" data-i="${i}">
      <div class="project-no">PROJECT ${String(i+1).padStart(2,"0")}</div>
      <div class="project-category">${p.category}</div>
      <div class="project-arrow">↗</div>
      <h2>${p.title}</h2>
      <p>${p.short}</p>
      <div class="tags">${p.stack.map(x=>`<span>${x}</span>`).join("")}</div>
    </article>
  `).join("");

  document.querySelectorAll(".project").forEach(el=>{
    el.addEventListener("click",()=>openProject(projects[Number(el.dataset.i)]));
  });
  $("year").textContent=new Date().getFullYear();
}

function openProject(p){
  $("modalCat").textContent=p.category;
  $("modalTitle").textContent=p.title;
  $("modalDesc").textContent=p.description;
  $("modalStack").innerHTML=(p.stack||[]).map(x=>`<span>${x}</span>`).join("");
  const links=[];
  if(p.github) links.push(`<a href="${p.github}" target="_blank" rel="noreferrer">GitHub ↗</a>`);
  if(p.demo) links.push(`<a href="${p.demo}" target="_blank" rel="noreferrer">Demo ↗</a>`);
  $("modalLinks").innerHTML=links.join("");
  $("modal").classList.add("open");
  $("modal").setAttribute("aria-hidden","false");
  document.body.classList.add("modal-open");
}
function hideProject(){
  $("modal").classList.remove("open");
  $("modal").setAttribute("aria-hidden","true");
  document.body.classList.remove("modal-open");
}
$("close").addEventListener("click",hideProject);
$("modal").addEventListener("click",e=>{if(e.target===$("modal"))hideProject()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")hideProject()});

/* ========================================================
   TEKNİK ÇİZİM & KALEM MOTORU (HER ZAMAN AKTİF & OTO-LİNK ÇİZİMİ)
   ======================================================== */
const canvas = $("inkCanvas"), ctx = canvas.getContext("2d");
const pencilCursor = $("pencilCursor");
const clearBtn = $("clearSketch");

const STORAGE_KEY = "blueprint_sketch_strokes";
let isDrawing = false;
let isAnimatingClick = false;
let activeColor = "#285bc4";
let activeWidth = 2.2;
let strokes = [];
let currentStroke = null;
let dpr = Math.min(devicePixelRatio || 1, 2);

// Tıklama vs Sürükleme (Click vs Drag) Ayrımı
let pointerDownPos = { x: 0, y: 0 };
let hasDragged = false;
let targetClickable = null;
let lastPointer = { x: window.innerWidth / 2, y: window.innerHeight / 2 };

// 1. LocalStorage İşlemleri: Çizimleri tarayıcı hafızasında saklar ve yükler
function loadStrokes() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      strokes = JSON.parse(saved);
      redraw();
    }
  } catch (err) {
    console.warn("Çizimler yüklenirken hata:", err);
  }
}

function saveStrokes() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(strokes));
  } catch (err) {
    console.warn("Çizimler kaydedilirken hata:", err);
  }
}

function clearStrokes() {
  strokes = [];
  currentStroke = null;
  try {
    localStorage.removeItem(STORAGE_KEY);
  } catch (err) {}
  redraw();
}

function undoStroke() {
  if (strokes.length > 0) {
    strokes.pop();
    saveStrokes();
    redraw();
  }
}

// 2. High DPI (Retina) Canvas Boyutlandırması
function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.width = Math.round(innerWidth * dpr);
  canvas.height = Math.round(innerHeight * dpr);
  canvas.style.width = innerWidth + "px";
  canvas.style.height = innerHeight + "px";
  redraw();
}
window.addEventListener("resize", resize);

// 3. Vektörel Çizgi Çizimi (Bezier Eğrisi ile Pürüzsüzleştirme)
function renderStrokeOnCtx(targetCtx, stroke) {
  const pts = stroke.points;
  if (!pts || pts.length === 0) return;

  targetCtx.strokeStyle = stroke.color || "#285bc4";
  targetCtx.fillStyle = stroke.color || "#285bc4";
  targetCtx.lineWidth = stroke.width || 2.2;
  targetCtx.lineCap = "round";
  targetCtx.lineJoin = "round";

  if (pts.length === 1) {
    targetCtx.beginPath();
    targetCtx.arc(pts[0].x, pts[0].y, (stroke.width || 2.2) / 1.5, 0, Math.PI * 2);
    targetCtx.fill();
    return;
  }

  targetCtx.beginPath();
  targetCtx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length - 1; i++) {
    const midX = (pts[i].x + pts[i + 1].x) / 2;
    const midY = (pts[i].y + pts[i + 1].y) / 2;
    targetCtx.quadraticCurveTo(pts[i].x, pts[i].y, midX, midY);
  }
  targetCtx.lineTo(pts[pts.length - 1].x, pts[pts.length - 1].y);
  targetCtx.stroke();
}

function drawStroke(stroke) {
  renderStrokeOnCtx(ctx, stroke);
}

// 4. Tuvali Yeniden Çizdirme ve Sayfa Kaydırma (Scroll) Senkronizasyonu
function redraw() {
  const scrollX = window.scrollX || window.pageXOffset || 0;
  const scrollY = window.scrollY || window.pageYOffset || 0;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, innerWidth, innerHeight);
  ctx.translate(-scrollX, -scrollY);

  for (let i = 0; i < strokes.length; i++) {
    drawStroke(strokes[i]);
  }
  if (currentStroke && currentStroke.points.length > 0) {
    drawStroke(currentStroke);
  }
}
window.addEventListener("scroll", redraw, { passive: true });

// 5. Kalem İmleci Hareketi (Mouse & Touch)
function updatePencilPosition(clientX, clientY) {
  pencilCursor.style.left = clientX + "px";
  pencilCursor.style.top = clientY + "px";
}

window.addEventListener("pointermove", e => {
  lastPointer.x = e.clientX;
  lastPointer.y = e.clientY;
  if (!isAnimatingClick) {
    updatePencilPosition(e.clientX, e.clientY);
  }
});

document.addEventListener("pointerleave", () => {
  pencilCursor.style.opacity = "0";
});
document.addEventListener("pointerenter", () => {
  pencilCursor.style.opacity = "1";
});

// 6. İmlecin Altındaki Tıklanabilir Elemanı Bulma
function getClickableElement(clientX, clientY) {
  const elements = document.elementsFromPoint(clientX, clientY);
  for (const el of elements) {
    if (el === canvas || el === pencilCursor || el.closest("#pencilCursor")) continue;
    const clickable = el.closest("a, button, .project, .close, #clearSketch, #exportBtn");
    if (clickable) return clickable;
  }
  return null;
}

// 7. Bir Elemanın Etrafını Doğal Mimar Çizgisiyle Çizme (Parametrik Yol Üretici)
function generateBoxPoints(rect) {
  const pad = 6;
  const x = rect.left + (window.scrollX || window.pageXOffset || 0) - pad;
  const y = rect.top + (window.scrollY || window.pageYOffset || 0) - pad;
  const w = rect.width + pad * 2;
  const h = rect.height + pad * 2;

  const pts = [];
  const steps = 7;
  // Sol üst köşeden başla
  pts.push({ x: x + 6, y: y });

  // Üst kenar (soldan sağa)
  for (let i = 1; i <= steps; i++) {
    const t = i / steps;
    const wobble = Math.sin(t * Math.PI) * 1.5;
    pts.push({ x: x + 6 + t * (w - 3), y: y - wobble });
  }
  // Sağ kenar (yukarıdan aşağıya)
  for (let i = 1; i <= steps; i++) {
    const t = i / steps;
    const wobble = Math.sin(t * Math.PI) * 1.5;
    pts.push({ x: x + w + 3 + wobble, y: y + t * (h + 3) });
  }
  // Alt kenar (sağdan sola)
  for (let i = 1; i <= steps; i++) {
    const t = i / steps;
    const wobble = Math.sin(t * Math.PI) * 1.5;
    pts.push({ x: x + w + 3 - t * (w + 6), y: y + h + 3 + wobble });
  }
  // Sol kenar (aşağıdan yukarıya)
  for (let i = 1; i <= steps; i++) {
    const t = i / steps;
    const wobble = Math.sin(t * Math.PI) * 1.5;
    pts.push({ x: x - 3 - wobble, y: y + h + 3 - t * (h + 5) });
  }
  // Çizgi taşırması (architectural overshoot flourish)
  const overshootLen = Math.min(w * 0.35, 28);
  for (let i = 1; i <= 4; i++) {
    const t = i / 4;
    pts.push({ x: x - 3 + t * overshootLen, y: y - 2 + t * 1.5 });
  }
  return pts;
}

// 8. Otomatik Kalem Çizim Animasyonu (Linke Tıklanınca Çalışır)
function animateSketchAround(element, onComplete) {
  // Proje kartı ise kartın başlığını veya kendisini çevrele
  const targetToCircle = element.classList.contains("project")
    ? (element.querySelector("h2") || element)
    : element;

  const rect = targetToCircle.getBoundingClientRect();
  const allPts = generateBoxPoints(rect);

  const animStroke = {
    color: activeColor,
    width: 2.2,
    points: []
  };

  isAnimatingClick = true;
  pencilCursor.classList.add("drawing");

  const startTime = performance.now();
  const duration = 210; // 210ms: Hem net izlenir hem de bekleme hissi vermez

  function step(now) {
    const elapsed = now - startTime;
    const progress = Math.min(elapsed / duration, 1);
    const targetIdx = Math.floor(progress * (allPts.length - 1));

    animStroke.points = allPts.slice(0, targetIdx + 1);

    if (animStroke.points.length > 0) {
      const latest = animStroke.points[animStroke.points.length - 1];
      updatePencilPosition(
        latest.x - (window.scrollX || window.pageXOffset || 0),
        latest.y - (window.scrollY || window.pageYOffset || 0)
      );
    }

    currentStroke = animStroke;
    redraw();

    if (progress < 1) {
      requestAnimationFrame(step);
    } else {
      currentStroke = null;
      strokes.push(animStroke);
      saveStrokes();
      redraw();

      pencilCursor.classList.remove("drawing");
      isAnimatingClick = false;
      updatePencilPosition(lastPointer.x, lastPointer.y);

      if (onComplete) onComplete();
    }
  }

  requestAnimationFrame(step);
}

// 9. Tıklama Eylemini Gerçekleştirme
function executeClick(el) {
  if (!el) return;

  if (el.id === "clearSketch") {
    clearStrokes();
    const orig = el.textContent;
    el.textContent = "TEMİZLENDİ ⌫";
    setTimeout(() => { el.textContent = orig; }, 1200);
    return;
  }

  if (el.id === "exportBtn") {
    captureAndDownloadBlueprint();
    return;
  }

  const projectCard = el.closest(".project");
  if (projectCard) {
    const idx = Number(projectCard.dataset.i);
    if (!isNaN(idx) && projects[idx]) {
      openProject(projects[idx]);
    }
    return;
  }

  const closeBtn = el.closest("#close");
  if (closeBtn) {
    hideProject();
    return;
  }

  const link = el.closest("a");
  if (link) {
    const href = link.getAttribute("href") || "";
    if (href.startsWith("#")) {
      const target = document.querySelector(href);
      if (target) {
        target.scrollIntoView({ behavior: "smooth" });
      }
    } else if (link.target === "_blank") {
      window.open(link.href, "_blank");
    } else if (href && !href.startsWith("javascript:")) {
      window.location.href = link.href;
    }
    return;
  }

  if (el.tagName.toLowerCase() === "button") {
    el.click();
  }
}

// 10. Sayfa ve Çizimlerin Tam Görüntüsünü İndirme (PNG Çıktı Alma)
async function captureAndDownloadBlueprint() {
  const exportBtn = $("exportBtn");
  const origText = exportBtn ? exportBtn.textContent : "ÇIKTI AL ⤓";
  if (exportBtn) exportBtn.textContent = "HAZIRLANIYOR... ⏳";

  // Sabit tuvali ve kalemi DOM ekran görüntüsünden gizle
  canvas.style.display = "none";
  pencilCursor.style.display = "none";

  try {
    if (!window.html2canvas) {
      await new Promise((res, rej) => {
        const s = document.createElement("script");
        s.src = "https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js";
        s.onload = res;
        s.onerror = rej;
        document.head.appendChild(s);
      });
    }

    const prevScrollX = window.scrollX || window.pageXOffset || 0;
    const prevScrollY = window.scrollY || window.pageYOffset || 0;
    window.scrollTo(0, 0);

    // Scroll pozisyonunun oturması için kısa bir bekleme
    await new Promise(r => setTimeout(r, 80));

    // scale: 1 -> Birebir 1:1 orijinal boyut (büyütme/bozulma yapmaz, sağa kaydırmaz)
    const fullCanvas = await window.html2canvas(document.documentElement, {
      backgroundColor: "#e8eef3",
      scale: 1,
      useCORS: true,
      logging: false
    });

    window.scrollTo(prevScrollX, prevScrollY);

    // Çizimleri 1:1 ölçekte tam koordinatlarıyla görselin üzerine ekle
    const exportCtx = fullCanvas.getContext("2d");
    for (const stroke of strokes) {
      renderStrokeOnCtx(exportCtx, stroke);
    }

    fullCanvas.toBlob(blob => {
      if (!blob) throw new Error("Görüntü oluşturulamadı.");
      const a = document.createElement("a");
      const dateStr = new Date().toISOString().slice(0, 10);
      a.download = `turker-kivilcim-blueprint-portfolio-${dateStr}.png`;
      a.href = URL.createObjectURL(blob);
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(a.href);

      if (exportBtn) {
        exportBtn.textContent = "İNDİRİLDİ! ✓";
        setTimeout(() => { exportBtn.textContent = origText; }, 2000);
      }
    }, "image/png");

  } catch (err) {
    console.error("Çıktı alınırken hata:", err);
    if (exportBtn) {
      exportBtn.textContent = "HATA OLUŞTU!";
      setTimeout(() => { exportBtn.textContent = origText; }, 2000);
    }
  } finally {
    canvas.style.display = "block";
    pencilCursor.style.display = "block";
    redraw();
  }
}

// 11. Tuval Üzerinde Çizim & Tıklama Olayları
canvas.addEventListener("pointerdown", e => {
  if (e.button !== 0 || isAnimatingClick) return; // Sadece sol tık
  e.preventDefault(); // Metin seçimini engeller
  canvas.setPointerCapture(e.pointerId);

  isDrawing = true;
  hasDragged = false;
  pointerDownPos = { x: e.clientX, y: e.clientY };
  targetClickable = getClickableElement(e.clientX, e.clientY);

  pencilCursor.classList.add("drawing");

  const ptX = Math.round(e.pageX ?? (e.clientX + (window.scrollX || window.pageXOffset || 0)));
  const ptY = Math.round(e.pageY ?? (e.clientY + (window.scrollY || window.pageYOffset || 0)));

  currentStroke = {
    color: activeColor,
    width: activeWidth,
    points: [{ x: ptX, y: ptY }]
  };
  redraw();
});

canvas.addEventListener("pointermove", e => {
  if (!isDrawing || !currentStroke || isAnimatingClick) return;
  e.preventDefault();

  const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
  if (dist > 7) {
    hasDragged = true;
    targetClickable = null; // Kullanıcı sürüklüyor; link tıklamasını iptal et, serbest çizime geç!
  }

  const ptX = Math.round(e.pageX ?? (e.clientX + (window.scrollX || window.pageXOffset || 0)));
  const ptY = Math.round(e.pageY ?? (e.clientY + (window.scrollY || window.pageYOffset || 0)));
  const lastPt = currentStroke.points[currentStroke.points.length - 1];

  const dx = ptX - lastPt.x;
  const dy = ptY - lastPt.y;
  if (dx * dx + dy * dy >= 4) {
    currentStroke.points.push({ x: ptX, y: ptY });
    redraw();
  }
});

function finishDrawing(e) {
  if (!isDrawing) return;
  isDrawing = false;
  pencilCursor.classList.remove("drawing");

  // Eğer sürükleme yapılmadıysa ve bir tıklanabilir elemana basıldıysa: OTO-ÇİZİM ANİMASYONU!
  if (!hasDragged && targetClickable) {
    const clicked = targetClickable;
    currentStroke = null;
    targetClickable = null;
    redraw();

    animateSketchAround(clicked, () => {
      executeClick(clicked);
    });
    return;
  }

  // Normal serbest çizim tamamlandı
  if (currentStroke && currentStroke.points.length > 0) {
    strokes.push(currentStroke);
    saveStrokes();
  }
  currentStroke = null;
  redraw();
}

canvas.addEventListener("pointerup", finishDrawing);
canvas.addEventListener("pointercancel", finishDrawing);

// 12. Klavye Kısayolları (ESC: Modal Kapat, Ctrl+Z: Geri Al, C: Temizle)
document.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    if ($("modal").classList.contains("open")) {
      hideProject();
      return;
    }
  }

  // Ctrl+Z / Cmd+Z: Geri Al
  if ((e.ctrlKey || e.metaKey) && (e.key === "z" || e.key === "Z")) {
    e.preventDefault();
    undoStroke();
  }

  // C tuşu: Çizimleri temizle (input içinde değilse)
  if ((e.key === "c" || e.key === "C") && !e.ctrlKey && !e.metaKey) {
    const tag = document.activeElement ? document.activeElement.tagName.toLowerCase() : "";
    if (tag !== "input" && tag !== "textarea" && !$("modal").classList.contains("open")) {
      clearStrokes();
    }
  }
});

resize();
loadStrokes();
load().catch(e=>console.error(e));
</script>
